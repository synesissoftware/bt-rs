name: Rust CI

on:
  push:
    branches:
      - master
      - dev
      - boilerplate
      - idiomatic
      - rc1
      - rc2
      - rc3
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Stable tests, Clippy, docs, format, checkers, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (all targets)
        run: cargo +stable test --all-targets --locked

      - name: cargo test (no default features)
        run: cargo +stable test --no-default-features --locked

      - name: cargo test (null feature)
        run: cargo +stable test --features null-feature --locked

      - name: cargo clippy
        run: cargo +stable clippy --all-targets --locked -- -D warnings

      - name: cargo doc
        run: RUSTDOCFLAGS="-D warnings" cargo +stable doc --no-deps --locked

      - name: Install pinned nightly rustfmt
        run: rustup toolchain install nightly-2026-08-08 --profile minimal --component rustfmt

      - name: rustfmt
        run: ./scripts/fmt --check

      - name: DOC_76 checker
        run: python3 scripts/check_doc_76.py

      - name: RUST_TEST_NAMING checker
        run: python3 scripts/check_test_names.py

      - name: DERIVE_LAYOUT checker
        run: python3 scripts/check_derives.py

      - name: cargo package (list)
        run: cargo +stable package --list --locked

      - name: cargo publish (dry run)
        run: cargo +stable publish --dry-run --locked

  msrv:
    name: MSRV (1.74)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.74.0

      - uses: Swatinem/rust-cache@v2

      - name: cargo check (library)
        run: cargo check --lib --locked
